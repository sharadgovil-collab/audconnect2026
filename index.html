<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A1633">
<title>AudConnect 2026 | NextGen Audiology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,500&family=Tinos:ital,wght@0,400;0,700;1,400&family=Mrs+Saint+Delafield&family=Orbitron:wght@700;800&family=Grand+Hotel&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0A1633;--card:#111F45;--card2:#16275A;--line:rgba(255,255,255,.13);--red:#E1192E;--red-t:#FF4A5C;
  --ink:#FFFFFF;--grey:#B5BFD8;--ok:#4CC38A;--gold:#F2B84B;
  --font:"Montserrat",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
/* The AudConnect brand is a dark navy identity, so both schemes use it */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--navy:#0A1633;--card:#111F45}}
:root[data-theme="dark"]{--navy:#0A1633;--card:#111F45}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--navy)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background:
   radial-gradient(ellipse 70% 40% at 0% 100%,rgba(225,25,46,.28),transparent 70%),
   radial-gradient(ellipse 60% 35% at 100% 0%,rgba(225,25,46,.16),transparent 70%),
   var(--navy);background-attachment:fixed}
body::before{content:"";position:fixed;right:0;top:0;width:55vw;max-width:340px;height:260px;pointer-events:none;z-index:0;
  background-image:radial-gradient(circle,rgba(225,25,46,.55) 1.3px,transparent 1.6px);background-size:14px 14px;
  -webkit-mask-image:linear-gradient(225deg,#000 0%,transparent 65%);mask-image:linear-gradient(225deg,#000 0%,transparent 65%)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red-t);outline-offset:2px}
.app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-bottom:104px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,22,51,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-bottom:1px solid var(--line)}
.logo-row{display:flex;align-items:center;gap:10px}
.logo-img{width:34px;height:34px;border-radius:50%;background:#fff;object-fit:cover}
.wordmark{font-weight:800;letter-spacing:.14em;font-size:12px;line-height:1.2}
.wordmark b{display:block;font-weight:900;letter-spacing:.02em;font-size:15px}
.hdr-btn{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-size:13px;font-weight:700}
main{padding:0 20px 20px}
/* Brand titles: wide tracked caps between red rules, as on the posters */
.rule-h{display:flex;align-items:center;gap:14px;margin:30px 0 16px;font-size:15px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;white-space:nowrap}
.rule-h::before,.rule-h::after{content:"";flex:1;height:2px;background:var(--red)}
.page-title{margin:22px 0 4px;font-size:30px;font-weight:900;letter-spacing:.01em;text-transform:uppercase;line-height:1.05}
.tag{color:var(--grey);letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:600}
p{margin:0 0 10px}.muted{color:var(--grey)}.small{font-size:13px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.redbox{border:1.5px solid var(--red);border-radius:16px;padding:14px 16px;background:rgba(225,25,46,.08)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:800;letter-spacing:.04em;background:var(--red);color:#fff;width:100%}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.field{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.field::placeholder{color:#7F8AA8}
.field:focus{border-color:var(--red-t);outline:none}
select.field option{background:var(--card)}
label.lbl{display:block;font-size:13px;font-weight:600;color:var(--grey);margin:14px 0 6px}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-weight:700}
.yn button[aria-pressed="true"]{border-color:var(--red);background:rgba(225,25,46,.18)}
/* Hero */
.hero{text-align:center;padding:30px 0 6px}
.hero .logo-big{width:96px;height:96px;border-radius:50%;background:#fff;object-fit:cover;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.hero .kick{margin-top:18px;display:flex;align-items:center;gap:12px;justify-content:center;color:#E1192E;font-weight:900;font-size:clamp(17px,5.4vw,22px);letter-spacing:.02em;white-space:nowrap}.hero .kick::before,.hero .kick::after{content:"";flex:0 1 90px;height:2px;background:#E1192E}
.ngimg{display:block;width:min(88%,420px);height:auto;margin:10px auto 8px}
.ng{font-weight:900;font-size:clamp(40px,12.5vw,62px);line-height:.92;letter-spacing:-.01em;margin:8px 0 10px;
  background:linear-gradient(180deg,#FFFFFF 0%,#E4E8F2 45%,#9AA4BD 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ng .x{background:linear-gradient(160deg,#FF6A78,#E1192E 55%,#8E0A18);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .tl{font-style:italic;font-weight:500;font-size:clamp(13px,4.2vw,17px);color:#fff;letter-spacing:.01em}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;text-align:left}
.fact{display:flex;gap:10px;align-items:flex-start}
.ico{width:36px;height:36px;border-radius:50%;background:var(--red);display:grid;place-items:center;flex-shrink:0}
.ico svg{width:18px;height:18px}
.fact b{display:block;font-size:13px;letter-spacing:.02em}
.landing{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding-bottom:40px}
.landing{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 24px 36px;overflow:hidden}
.swoosh{position:fixed;left:0;top:0;width:min(78vw,340px);height:auto;pointer-events:none;z-index:0}
.lp{position:relative;z-index:1;max-width:420px;width:100%;margin:0 auto}
.lp-logo{width:118px;margin:0 auto 18px}
.lp-logo img{width:118px;height:118px;display:block}
.lp-kick{position:relative;text-align:center;padding:14px 0 12px;margin:0 auto;width:78%}
.lp-kick::before,.lp-kick::after{content:"";position:absolute;left:0;right:0;height:2px;background:#E1192E}
.lp-kick::before{top:0}.lp-kick::after{bottom:0}
.lp-dot{position:absolute;top:-4px;left:50%;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#E1192E}
.lp-kick span{font-weight:800;font-size:clamp(20px,6.4vw,26px);letter-spacing:.01em;color:#fff}
.lp-ng{display:block;width:100%;height:auto;margin:14px 0 10px}
.lp-tl{font-weight:500;font-size:clamp(11px,3.75vw,16px);letter-spacing:.06em;white-space:nowrap;text-align:center;color:#E6E9F2;margin-bottom:26px}
.lp-facts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
.lp-f{display:flex;gap:9px;align-items:flex-start}
.lp-f .ico{width:38px;height:38px;display:grid;place-items:center;flex-shrink:0}.lp-f .ico svg{width:19px;height:19px}
.lp-f b{display:block;white-space:nowrap;font-weight:800;font-size:clamp(12px,3.5vw,15px);line-height:1.3}
.lp-f div>span{display:block;font-size:clamp(12px,3.4vw,14px);line-height:1.35}
.lp-f em{display:block;font-size:clamp(11px,3.1vw,13px);line-height:1.35;color:#E6E9F2}
.lp .btn.big{margin-top:14px}
.btn.big{padding:18px;font-size:18px;letter-spacing:.12em;border-radius:14px;box-shadow:0 10px 30px -10px rgba(225,25,46,.7)}
/* Programme */
.prog .row{display:flex;gap:14px;padding:15px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.prog .row:first-child{border-top:0}
.num{font-weight:900;font-size:30px;line-height:1;min-width:44px;color:#fff}
.num.dim{font-size:13px;font-weight:700;color:var(--grey);padding-top:3px}
.sess-title{display:block;font-weight:800;text-transform:uppercase;letter-spacing:.03em;color:var(--red-t);line-height:1.25;font-size:14px}
.sess-sub{display:block;margin-top:3px}
.sess-by{display:block;font-weight:700;font-size:13px;margin-top:4px}
.sess-time{display:block;font-size:12px;color:var(--grey);margin-top:4px;font-variant-numeric:tabular-nums}
.row.live{background:rgba(225,25,46,.1);margin:0 -12px;padding-left:12px;padding-right:12px;border-radius:12px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:3px 9px;border-radius:99px;background:var(--red);color:#fff;text-transform:uppercase}
.pill.ok{background:transparent;border:1px solid var(--ok);color:var(--ok)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red-t);margin-right:6px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
/* Speakers */
.spk-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 10px}
.spk{background:none;border:0;padding:0;text-align:center}
.ph{width:84px;height:84px;border-radius:50%;object-fit:cover;display:block;margin:0 auto;background:#fff;box-shadow:3px 3px 0 0 var(--red)}
.ph.ini{display:grid;place-items:center;font-weight:900;font-size:24px;color:var(--navy)}
.spk .n{display:block;font-weight:800;text-transform:uppercase;font-size:11.5px;letter-spacing:.03em;margin-top:10px;line-height:1.25}
.spk .n::after{content:"";display:block;width:22px;height:2px;background:var(--red);margin:5px auto 4px}
.spk .r{display:block;font-size:11px;color:var(--grey);line-height:1.35}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:rgba(10,22,51,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button[aria-current="page"]{color:var(--red-t)}
nav.tabs svg{width:22px;height:22px}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:700;font-size:13px;color:var(--grey)}
.seg button[aria-pressed="true"]{background:var(--red);color:#fff}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.item{display:flex;gap:14px;padding:14px 16px;border:0;border-top:1px solid var(--line);align-items:center;width:100%;text-align:left;background:none}
.item:first-child{border-top:0}
.q{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line)}.q:first-child{border-top:0}
.up{border:1.5px solid var(--line);background:var(--card2);border-radius:10px;min-width:46px;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800}
.up[aria-pressed="true"]{border-color:var(--red-t);color:var(--red-t)}
.up svg{width:14px;height:14px}
.opt{display:block;width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;background:var(--card2);margin-bottom:8px;text-align:left;position:relative;overflow:hidden}
.opt .fill{position:absolute;inset:0 auto 0 0;background:rgba(225,25,46,.3);transition:width .5s}
.opt span{position:relative}
.opt[aria-pressed="true"]{border-color:var(--red-t)}
.opt.right{border-color:var(--ok)}.opt.wrong{border-color:var(--red-t);opacity:.7}
.cloud{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center;padding:18px 8px;min-height:150px}
.cloud span{font-weight:900;line-height:1.1}
.stars{display:flex;gap:6px}
.star{border:0;background:none;padding:2px;color:#3A4770}.star svg{width:34px;height:34px}
.star.on{color:var(--gold)}
.lb{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line)}.lb:first-child{border-top:0}
.lb .r{font-weight:900;width:22px;color:var(--red-t)}.lb.me{background:rgba(225,25,46,.14)}
.nps{display:grid;grid-template-columns:repeat(11,1fr);gap:4px}
.nps button{padding:9px 0;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:13px}
.nps button[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet,.dot{animation:none}.opt .fill{transition:none}}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-8px auto 14px}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fff;color:var(--navy);padding:10px 16px;border-radius:10px;font-weight:700;font-size:14px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
.badge{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.badge .band{background:var(--red);padding:14px 18px;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.14em;font-size:12px}
.badge .body{padding:20px 18px}
.badge .nm{font-size:28px;font-weight:900;text-transform:uppercase;line-height:1.05}
.cert{border:2px solid var(--red);border-radius:14px;padding:26px 18px;text-align:center;background:var(--navy)}
.demo{font-size:12px;color:var(--grey);text-align:center;margin-top:14px}
/* Photo wall */
.feed{display:grid;gap:14px}
.post{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.post img{display:block;width:100%;max-height:520px;object-fit:cover;background:#000}
.post .meta{padding:12px 14px}
.like{border:0;background:none;padding:0;font-weight:800;display:inline-flex;gap:6px;align-items:center}
.like svg{width:20px;height:20px}.like[aria-pressed="true"]{color:var(--red-t)}
.upl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed rgba(255,255,255,.28);border-radius:16px;padding:22px;text-align:center;cursor:pointer;background:rgba(225,25,46,.06)}
.upl svg{width:34px;height:34px;color:var(--red-t)}
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.thumb{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;left:6px;right:6px;bottom:6px}
.sl{display:flex;gap:3vw;align-items:center;width:100%;height:72vh}
.sl-ph{position:relative;flex:0 0 62%;height:100%;border-radius:22px;overflow:hidden;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.45)}
.sl-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(30px) brightness(.45);transform:scale(1.2)}
.sl-img{position:relative;display:block;width:100%;height:100%;object-fit:contain}
.sl-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:2.2vh}
.sl-tag{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}.sl-tag .ag-word{font-size:4vw}.sl-hash{font-size:1.4vw;font-weight:800;color:var(--red-t)}
.sl-by{display:flex;align-items:center;gap:1vw;font-size:2.1vw;color:#fff}.sl-by .ag-av{width:4.4vw;height:4.4vw}.sl-by .ag-av b{font-size:1.4vw}
.sl-cap{margin:0;font-size:1.7vw;line-height:1.45;color:#E6EAF4;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.sl-meta{font-size:1.5vw;font-weight:700;color:#DCE1EE}
.sl-foot{display:flex;align-items:center;gap:14px;font-size:1.1vw;color:#9AA6C4;font-weight:700}
.sl-bar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden}.sl-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#E1192E,#F2B84B);animation:slBar 8s linear forwards}
.sl-cta{margin:0;font-size:1.2vw;color:#9AA6C4}
.sl.in .sl-ph{animation:slIn .9s ease-out}.sl.in .sl-side{animation:slUp .9s ease-out}
@keyframes slIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
@keyframes slUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes slBar{from{width:0}to{width:100%}}
.wall{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}@media (max-width:800px){.wall{grid-template-columns:repeat(3,1fr)}}
.wall figure{margin:0;border-radius:14px;overflow:hidden;background:var(--card);aspect-ratio:4/5;display:flex;flex-direction:column}
.wall img{flex:1;min-height:0;width:100%;object-fit:cover}
.wall figcaption{padding:8px 12px;font-weight:700;font-size:clamp(12px,1.3vw,16px)}
/* Attendance certificate, matching the SAPS membership certificate */
.certwrap{container-type:inline-size}
.pcert{position:relative;aspect-ratio:2291/1600;background:#fff;color:#111;font-family:"Tinos","Times New Roman",Times,serif;border:.45cqw solid #A0302F;outline:.45cqw solid #A0302F;outline-offset:-1.9cqw;text-align:center;overflow:hidden}
.pcert .lg{position:absolute;top:4.6cqw;left:50%;transform:translateX(-50%);width:16.5cqw}
.pcert .ttl{position:absolute;top:21.2cqw;left:0;right:0;font-weight:700;font-size:5.2cqw;letter-spacing:.01em;line-height:1}
.pcert .it{font-style:italic}
.pcert .l1{position:absolute;top:28.6cqw;left:0;right:0;font-size:2.35cqw}
.pcert .nm{position:absolute;top:32.6cqw;left:4cqw;right:4cqw;font-weight:700;font-size:3.1cqw;color:#8E8E8E;text-transform:uppercase;letter-spacing:.02em}
.pcert .body{position:absolute;top:38.6cqw;left:8cqw;right:8cqw;font-size:2.35cqw;line-height:1.4}
.pcert .cpe{position:absolute;top:50.4cqw;left:10cqw;right:10cqw;font-size:1.55cqw;color:#444}
.pcert .sig{position:absolute;left:6.5cqw;top:49.5cqw;text-align:left}
.pcert .sig .s{font-family:"Mrs Saint Delafield","Brush Script MT",cursive;font-size:5.6cqw;line-height:1;color:#1a1a3a;transform:rotate(-4deg);transform-origin:left bottom;margin-left:1cqw}
.pcert .sig .ln{width:21cqw;height:.12cqw;background:#555;margin:.4cqw 0 1.2cqw}
.pcert .sig .n{font-size:1.75cqw;line-height:1.5}
.pcert .seal{position:absolute;right:6cqw;bottom:5.4cqw;width:16.5cqw}
/* About the Society */
.about{display:grid;gap:10px}
.ab{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;padding:14px 16px}
.ab-t{display:block;color:var(--red-t);font-weight:900;letter-spacing:.12em;text-transform:uppercase;font-size:13px;margin-bottom:6px}
.ab p{margin:0;font-size:15px;line-height:1.5}
.vals{display:flex;flex-wrap:wrap;gap:6px}
.vals span{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:5px 11px;font-size:13px;font-weight:700}
.comm .ph{box-shadow:3px 3px 0 0 var(--red)}
.bio{font-size:14px;line-height:1.6;color:#DCE1EE;margin:10px 0 0}
/* Welcome cards (Instagram style) */

.pc2 .lgs{position:absolute;left:0;right:0;top:53.5cqw;display:flex;justify-content:center;align-items:center;gap:1.6cqw}

.pc2 .acl{position:relative;width:27cqw}.pc2 .acl img{width:100%;height:auto;display:block}.pc2 .acl span{position:absolute;right:1.2%;bottom:-3%;font-family:"Orbitron","Eurostile","Arial Black",sans-serif;font-weight:800;font-size:2.4cqw;color:#2E0B0B;letter-spacing:.08em;line-height:1}
.pc2 .ac{text-align:left;color:#46587A;line-height:1.1}.pc2 .ac b{display:block;font-size:2.4cqw;font-weight:800;letter-spacing:.04em}.pc2 .ac span{font-size:1.5cqw;letter-spacing:.12em;color:#C0203A;font-weight:700}
.qmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted,#9AA3B8)}

.pill.saps{background:#E1192E;color:#fff}

.sq-t{display:block;font-size:.55em;opacity:.75;margin-top:6px;font-weight:600}
.ag-empty{padding:34px 22px 28px;text-align:center}

.ag-empty b{display:block;font-size:22px;font-weight:800;color:#111;margin-bottom:6px}
.ag-empty p{margin:0 auto 16px;max-width:260px;color:#737373;line-height:1.4}
.ag-empty-btn{color:#0095F6;font-weight:700;cursor:pointer}
.pst-list{display:flex;flex-direction:column;gap:12px}
.pst{display:flex;flex-direction:column;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:10px}
.pst-open{display:flex;gap:12px;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.pst-like{align-self:flex-end;margin-top:8px;border:1px solid var(--line);background:var(--card2);color:#fff;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer}
.pst-like.on{background:var(--red);border-color:var(--red)}
.scale5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale5 button{padding:10px 0;border-radius:8px;border:1px solid var(--line);background:var(--card2);font-weight:700;font-size:15px}
.scale5 button[aria-pressed="true"]{background:var(--red);border-color:var(--red)}
.fbstars{display:flex;flex-direction:column;gap:2px}
.fbst{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.fbst:last-child{border-bottom:0}
.fbst>span:first-child{font-weight:700;font-size:14px}
.stars.sm{gap:2px}.stars.sm .star svg{width:26px;height:26px}

.pst-b{display:flex;flex-direction:column;gap:4px;min-width:0}.pst-b b{font-size:14px;line-height:1.3;color:#fff}
.pst-k{font-size:12.5px;line-height:1.4;color:#DCE1EE}.pst-more{font-size:12px;font-weight:800;color:var(--red-t);margin-top:2px}
.pill.pst-aw{background:#F2B84B;color:#3a2a00;align-self:flex-start}
.pst-full img{display:block;width:100%;border-radius:8px;background:#fff}
.spn{margin:34px 0 8px;background:#fff;border-radius:16px;padding:16px 14px 10px;color:#111;text-align:center}
.spn-t{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0A1633}
.spn-tier{padding:8px 0;border-top:1px solid #eee}
.spn-l{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;padding:2px 10px;border-radius:10px;margin-bottom:8px;color:#fff;background:#6b6b6b}
.spn-l.gold{background:#D9B54A;color:#3a2a00}.spn-l.silver{background:#cfcfcf;color:#333}
.spn-row{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:clamp(6px,2.5vw,14px);align-items:center;justify-items:center}
.spn-row.platinum{grid-template-columns:1fr}.spn-row.silver{grid-template-columns:1fr}
.spn-c{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:2.4/1}
.spn-c img{max-width:100%;max-height:100%;object-fit:contain}
.spn-row.platinum .spn-c{width:min(44%,170px);aspect-ratio:1.15/1}.spn-row.gold{grid-template-columns:repeat(2,1fr);row-gap:10px}.spn-row.gold .spn-c{width:min(88%,150px)}.spn-row.silver .spn-c{width:min(22%,84px);aspect-ratio:2.4/1}
.org-mini{margin:26px 0 6px;text-align:center;font-size:12px;color:var(--grey);display:flex;flex-direction:column;align-items:center;gap:2px}
.linkbtn{border:0;background:none;color:var(--grey);font:inherit;font-size:12px;font-weight:700;text-decoration:underline;letter-spacing:.04em;cursor:pointer;padding:4px}
/* Certificate (SAPS template) */
.pc3{position:relative;container-type:inline-size;aspect-ratio:1655/2338;max-width:520px;margin:0 auto;overflow:hidden;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.pc3 img{position:absolute;inset:0;width:100%;height:100%;display:block}
.pc3n{position:absolute;left:0;right:0;top:54.4%;transform:translateY(-50%);text-align:center;color:#fff;font-family:CertGothic,"Century Gothic",Montserrat,sans-serif;font-weight:700;white-space:nowrap;line-height:1}
/* Audigram (Instagram-style posts) */
.ag-word{font-family:"Audigram","Grand Hotel",cursive;font-weight:400;letter-spacing:.01em;background:linear-gradient(90deg,#FF6A78,#E1192E 45%,#F2B84B);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
.ag-head{display:flex;flex-direction:column;align-items:center;margin:4px 0 14px}.ag-head .ag-word{font-size:44px;padding:0 4px 4px}.ag-head .small{margin-top:-2px}
.ag-bar{display:flex;justify-content:center;align-items:center;padding:10px 14px 6px;border-bottom:1px solid #efefef}.ag-bar .ag-word{font-size:36px;padding:0 4px 4px}
.ag-card{background:#fff;color:#111;border-radius:18px;overflow:hidden;font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;box-shadow:0 14px 40px -18px rgba(0,0,0,.6)}
.ag-feed{gap:16px}
.ag-top{display:flex;align-items:center;gap:10px;padding:12px 14px}
.ag-top b{display:block;font-size:14px;font-weight:700;color:#111}.ag-top span{display:block;font-size:12px;color:#737373}
.ag-av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;padding:2px;background:linear-gradient(45deg,#F2B84B,#E1192E 50%,#0A1633)}
.ag-av img,.ag-av b{width:100%;height:100%;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#fff;display:grid;place-items:center;font-size:12px;color:#0A1633}
.ag-media{position:relative;background:#e9e9e9}
.ag-media img{display:block;width:100%;max-height:560px;object-fit:cover}
.ag-media.sq{aspect-ratio:1/1;overflow:hidden}
.ag-acts{position:relative;display:flex;align-items:center;gap:14px;padding:10px 14px 4px}
.ag-ic{border:0;background:none;padding:0;width:28px;height:28px;color:#111;cursor:pointer}
.ag-ic svg{width:28px;height:28px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.ag-ic.heart.on{color:#ED1C24}.ag-ic.heart.on svg{fill:#ED1C24;stroke:#ED1C24;animation:agpop .35s ease}
@keyframes agpop{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.ag-ic.heart.on svg{animation:none}}
.ag-dots{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:4px}.ag-dots i{width:6px;height:6px;border-radius:50%;background:#c7c7c7}.ag-dots i.on{background:#0095F6}
.ag-likes{margin:4px 14px 2px;font-weight:700;font-size:14px}
.ag-cap{margin:2px 14px 4px;line-height:1.4}.ag-cap b,.ag-cm b{font-weight:700;margin-right:4px}
.ag-tag{color:#00376B}
.ag-morebtn{border:0;background:none;padding:0;color:#737373;font:inherit;cursor:pointer}
.ag-more{display:block;border:0;background:none;padding:2px 14px;color:#737373;font-size:14px;cursor:pointer}
.ag-cm{margin:2px 14px;line-height:1.4}
.ag-add{display:flex;align-items:center;gap:8px;margin:8px 14px 0;border-top:1px solid #efefef;padding-top:8px}
.ag-in{flex:1;border:0;outline:0;font:inherit;font-size:14px;color:#111;background:none;padding:6px 0}
.ag-in::placeholder{color:#8e8e8e}
.ag-post{border:0;background:none;color:#0095F6;font-weight:700;font-size:14px;cursor:pointer}
.ag-time{margin:6px 14px 14px;font-size:11px;color:#8e8e8e;letter-spacing:.04em}
/* Welcome post carousel */
#welcome .ag-wrap{width:min(100%,430px);max-height:100%;overflow:auto;padding-bottom:6px}
.ag-pop{animation:igin .35s ease}
.ws-track{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.ws-track::-webkit-scrollbar{display:none}
.ws{flex:0 0 100%;height:100%;scroll-snap-align:start;position:relative;overflow:hidden}
.ws-host img{width:100%;height:100%;object-fit:cover;max-height:none}

.ws-ov span{font-size:11px;font-weight:800;letter-spacing:.2em;color:#FF6A78}
.ws-ov h2{margin:4px 0 6px;font-size:20px;line-height:1.2;font-weight:900;font-family:Montserrat,sans-serif}
.ws-ov p{margin:0;font-size:13px;color:#DCE1EE}
.ws-navy{background:radial-gradient(ellipse 80% 60% at 0% 100%,rgba(225,25,46,.35),transparent 70%),#0A1633;color:#fff;padding:18px 36px;display:flex;flex-direction:column;justify-content:center;font-family:Montserrat,sans-serif}
.ws-k{font-size:12px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#fff;margin-bottom:10px;text-align:center}

.ws-navy p{margin:0 0 4px;font-size:13.5px;line-height:1.45;color:#E6E9F2}
.ws-navy .cgrid{gap:10px 4px}
.ws-nav{position:absolute;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:50%;border:0;background:rgba(255,255,255,.7);color:#111;font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.ws-nav.l{left:5px}.ws-nav.r{right:5px}

.ag-go{margin-top:12px}
.ag-brand{display:flex;justify-content:center;margin:12px 0 4px}.ag-brand span{font-family:"Audigram","Grand Hotel",cursive;font-size:30px;background:#fff;border-radius:10px;padding:2px 22px 6px;color:#E1192E}
/* Organiser dashboard */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi .v{font-size:34px;font-weight:900;line-height:1}
.kpi .l{font-size:12px;color:var(--grey);font-weight:600;margin-top:6px}
.kpi.red{background:var(--red);border-color:var(--red)}.kpi.red .l{color:#fff;opacity:.85}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.act{border:1px solid var(--line);background:var(--card2);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700}
.act.on{background:var(--red);border-color:var(--red)}
.hbar{height:8px;border-radius:4px;background:#223262;overflow:hidden;margin-top:6px}.hbar i{display:block;height:100%;background:var(--red)}
.adm-flag{background:#fff;color:var(--navy);font-size:11px;font-weight:900;letter-spacing:.1em;border-radius:6px;padding:3px 7px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:10px 12px;border-top:1px solid var(--line)}.tbl tr:first-child td{border-top:0}
/* Stage screen */
.stage{position:fixed;inset:0;z-index:40;background:var(--navy);display:none;flex-direction:column;padding:calc(28px + env(safe-area-inset-top,0px)) 32px calc(28px + env(safe-area-inset-bottom,0px))}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 60% 50% at 0% 100%,rgba(225,25,46,.3),transparent 70%)}
.stage.open{display:flex}
.stage>*{position:relative}
.stage .hd{display:flex;justify-content:space-between;align-items:center;gap:12px}
.stage .main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:1100px;width:100%;margin:0 auto}
.stage h3{font-size:clamp(24px,4vw,50px);line-height:1.1;margin:0 0 26px;font-weight:900;text-transform:uppercase}
.stage .srow{margin-bottom:18px}.stage .lab{display:flex;justify-content:space-between;font-size:clamp(16px,2.2vw,26px);font-weight:700}
.stage .bar{height:18px;border-radius:9px;background:#223262;overflow:hidden;margin-top:6px}.stage .bar i{display:block;height:100%;background:var(--red)}

.stage .ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.stage .ctl button{background:var(--card2);border:0;border-radius:99px;padding:8px 14px;font-weight:700;font-size:13px}
.stage .ctl button[aria-pressed="true"]{background:var(--red)}
/* ===== v26: check in, welcome card, badge tags, points, polls, super admin ===== */
.wc-wrap{width:min(100%,400px);max-height:100%;overflow:auto;padding:4px 0 8px}
.wc{position:relative;background:linear-gradient(170deg,#0f1f47,#0a1633 55%,#0d1a3c);border-radius:18px;padding:30px 24px 22px;text-align:center;color:#fff;box-shadow:0 18px 40px -12px rgba(0,0,0,.7);animation:wcIn .5s ease-out}
@keyframes wcIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.wc-frame{position:absolute;inset:8px;border:1px solid rgba(214,177,92,.75);border-radius:12px;pointer-events:none}
.wc-frame:after{content:"";position:absolute;inset:4px;border:1px solid rgba(214,177,92,.28);border-radius:9px}
.wc-logo{width:56px;height:56px;border-radius:50%;background:#fff;padding:3px;box-shadow:0 0 0 2px #d6b15c}

.wc-greet{margin-top:16px;font:italic 400 19px Lora,Georgia,serif;color:#e9dcc0}
.wc-name{font:600 26px/1.15 Lora,Georgia,serif;margin-top:2px;color:#fff}
.wc-orn{display:flex;align-items:center;gap:10px;justify-content:center;color:#d6b15c;font-size:11px;margin:14px 0 12px}
.wc-orn span{width:58px;height:1px;background:linear-gradient(90deg,transparent,#d6b15c)}.wc-orn span:last-child{transform:scaleX(-1)}
.wc-body{font:400 13.4px/1.62 Lora,Georgia,serif;color:#dfe4f0;margin:0 4px}
.wc-eng{margin:16px 2px 0;padding:12px 12px;border-radius:12px;background:rgba(214,177,92,.09);border:1px solid rgba(214,177,92,.35);display:flex;flex-direction:column;gap:4px}
.wc-eng b{font-size:13px;color:#f2d98f}.wc-eng span{font-size:12px;line-height:1.5;color:#dfe4f0}
.wc-sig{margin-top:16px;display:flex;flex-direction:column;gap:2px}
.wc-sig i{font:italic 12px Lora,Georgia,serif;color:#c9c2b0}.wc-sig b{font-size:12.5px;font-weight:700;letter-spacing:.04em;color:#fff;margin-top:2px}
.wc-sig small{font:italic 10.8px/1.5 Lora,Georgia,serif;color:#a9b0c4;margin-top:2px}
.wc-btn{margin-top:18px;width:100%;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:13px;letter-spacing:.08em;color:#0a1633;background:linear-gradient(90deg,#d6b15c,#f2d98f,#d6b15c)}
.wc-tro{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px auto 0;background:#fff;border-radius:12px;padding:8px 14px;width:fit-content}
.wc-tro img{height:44px;max-width:150px;object-fit:contain}.wc-tro span{font-size:30px}.wc-tro b{color:#0a1633}
.here{display:flex;align-items:center;gap:10px;margin:14px 0 0;padding:10px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:14px}
.here b{font-size:18px;font-weight:900}
.here-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(76,195,138,.7);animation:hp 1.8s infinite;flex-shrink:0;display:inline-block}
@keyframes hp{0%{box-shadow:0 0 0 0 rgba(76,195,138,.7)}70%{box-shadow:0 0 0 9px rgba(76,195,138,0)}100%{box-shadow:0 0 0 0 rgba(76,195,138,0)}}
.st-here{display:flex;align-items:center;gap:8px;font-size:clamp(14px,1.6vw,20px);font-weight:600}.st-here b{font-size:1.3em}
.bd-ph{width:84px;height:84px;border-radius:50%;object-fit:cover;display:block;margin:0 0 12px;border:3px solid #fff}
.bd-t{margin:6px 0 0;font-weight:600;color:var(--grey)}.bd-co{margin:4px 0 0;font-weight:700}.bd-mid{margin:4px 0 0;font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.04em}
.badge.confirm .nm{font-size:24px}
.rtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.rtags.sub{margin-top:8px}.rtags.mini{margin-top:6px;gap:4px}
.rtag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:99px;color:#fff}
.rtags.mini .rtag,.rtags.mini .rtag2{font-size:9.5px;padding:2px 7px}
.rtag.speaker{background:#E1192E}.rtag.organiser{background:#0A1633;border:1.5px solid #F2B84B;color:#F2B84B}
.rtag.delegate{background:#0F9D8A}.rtag.host{background:#7A3FD1}.rtag.poster{background:#2F6FEB}
.rtag.sp-platinum{background:linear-gradient(90deg,#d9dde6,#ffffff,#c9ced9);color:#0A1633}.rtag.sp-gold{background:linear-gradient(90deg,#d6b15c,#f2d98f,#d6b15c);color:#3a2a00}.rtag.sp-silver{background:linear-gradient(90deg,#9aa3b5,#d7dce5,#9aa3b5);color:#0A1633}
.rtag2{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--line);color:var(--grey)}
.rtag2.mem{border-color:var(--gold);color:var(--gold)}.rtag2.guest{border-color:#8a94b0;color:#c3cbe0}.rtag2.ok{border-color:var(--ok);color:var(--ok)}.rtag2.warn{border-color:#F2B84B;color:#F2B84B}
.pts{margin-top:14px;padding:16px 18px;border-radius:16px;background:linear-gradient(135deg,rgba(242,184,75,.16),rgba(225,25,46,.10));border:1px solid rgba(242,184,75,.4)}
.pts-n{font-size:30px;font-weight:900;color:var(--gold);line-height:1}.pts-n small{font-size:14px;font-weight:700;color:var(--ink)}
.hdr-pts{display:inline-flex;align-items:center;gap:3px;margin-left:6px;padding:2px 8px;border-radius:99px;background:rgba(242,184,75,.16);color:var(--gold);font-size:12px}
.ep-ph{display:flex;align-items:center;gap:14px;margin:4px 0 6px}
.ep-av{width:72px;height:72px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:#fff;color:var(--navy);font-weight:900;font-size:22px;flex-shrink:0}.ep-av img{width:100%;height:100%;object-fit:cover}
.sapsbar{display:flex;align-items:center;gap:10px;width:100%;margin:12px 0 4px;padding:10px 12px;border-radius:12px;border:1.5px dashed var(--line);background:var(--card);color:var(--grey);font-size:13px;text-align:left}
.sapsbar img{width:28px;height:28px;border-radius:50%;background:#fff;padding:2px}.sapsbar.on{border-style:solid;border-color:var(--gold);color:#fff;background:rgba(242,184,75,.12)}.sapsbar b{color:var(--gold)}
.saps-ok{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#2F6FEB;color:#fff;font-size:9px;vertical-align:1px}
.pill.live{background:var(--red);animation:lp 1.6s infinite}@keyframes lp{50%{opacity:.6}}
.act.danger{border-color:rgba(255,74,92,.6);color:var(--red-t);background:transparent}
.btn.danger{background:#b5121f}
.pr{margin-bottom:10px}.pr-l{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}.pr.lead .pr-l{color:var(--gold)}.pr.lead .hbar i{background:var(--gold)}
.hbar.grow i,.stage .bar.grow i{width:0;animation:barg 1.1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes barg{to{width:var(--w)}}
.stage .srow.lead .lab{color:var(--gold)}.stage .srow.lead .bar i{background:var(--gold)}
.st-opts{display:grid;gap:12px;margin:10px 0 0}.st-opt{display:flex;align-items:center;gap:14px;font-size:clamp(18px,2.4vw,30px);font-weight:700;padding:12px 18px;border-radius:14px;background:var(--card);border:1px solid var(--line)}
.st-opt b{display:grid;place-items:center;width:1.6em;height:1.6em;border-radius:50%;background:var(--red);flex-shrink:0}
.st-count{text-align:center;margin-top:22px;font-size:clamp(20px,2.6vw,32px);font-weight:700}.st-count b{font-size:2em;color:var(--gold);margin-right:8px}
.cloud.sm{min-height:70px;padding:8px 4px}
.wchip{display:inline-flex;gap:2px}
.bonus{display:inline-block;margin-left:4px;padding:2px 8px;border-radius:99px;background:rgba(242,184,75,.18);color:var(--gold);font-size:11px;font-weight:800}
.opt-l{font-weight:500;color:var(--grey);font-size:12px}
.medal{color:var(--gold)}
.seg.adtabs{flex-wrap:wrap;gap:4px}.seg.adtabs button{flex:1 0 30%}
.pts.won{text-align:center;border-color:var(--gold);background:linear-gradient(135deg,rgba(242,184,75,.3),rgba(225,25,46,.15))}
.dr-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:30px}
.dr-slot{display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px 16px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:center;min-height:220px;justify-content:center}
.dr-m{font-size:clamp(40px,5vw,64px)}.dr-l{font-size:clamp(14px,1.4vw,18px);letter-spacing:.2em;text-transform:uppercase;color:var(--grey);font-weight:700}
.dr-n{font-size:clamp(22px,2.8vw,40px);font-weight:900;line-height:1.1}.dr-c{color:var(--grey);font-size:clamp(14px,1.4vw,20px)}
.dr-slot.spin{border-color:var(--gold);box-shadow:0 0 40px rgba(242,184,75,.35)}.dr-slot.spin .dr-n{color:var(--gold)}
.dr-slot.won{border-color:var(--gold);background:linear-gradient(160deg,rgba(242,184,75,.22),var(--card));animation:drwin .8s ease-out}
@keyframes drwin{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.ag-cap.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;position:relative}.ag-cap.clamp:after{content:"… more";position:absolute;right:0;bottom:0;padding-left:24px;background:linear-gradient(90deg,transparent,var(--card) 30%);color:var(--grey)}
.me-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.here.sm{margin:0;padding:6px 12px;border-radius:99px;font-size:13px;white-space:nowrap}.here.sm b{font-size:15px}
.nowrap{white-space:nowrap}.fact .small{display:block}
.hdr-nm{display:inline-block;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom}
.spk-grid{align-items:start}.spk .ph{width:84px;height:84px;object-fit:cover;object-position:50% 50%}
.dr-spot{display:flex;gap:4vw;align-items:center;justify-content:center;height:100%;animation:drwin .8s ease-out;cursor:pointer}
.dr-spot img{height:62vh;max-width:42vw;object-fit:contain;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
.dr-spot-t{display:flex;flex-direction:column;gap:12px;max-width:44vw}.dr-spot-t b{font-size:clamp(34px,5.4vw,80px);line-height:1.05;color:var(--gold)}
.dr-spot-t .dr-c{font-size:clamp(18px,2.2vw,30px)}.dr-spot-t p{font-size:clamp(16px,1.8vw,24px);color:var(--grey);margin:8px 0 0}
.dr-slot.won{cursor:pointer}
.item.sitem{display:flex;align-items:center;justify-content:flex-start;gap:14px;text-align:left;width:100%;padding:12px 0}
.item.sitem .ph{margin:0;flex:0 0 52px;width:52px;height:52px}.sitem-t{flex:1;min-width:0;text-align:left}
.tmedal{display:inline-grid;place-items:center;width:1.25em;height:1.25em;border-radius:50%;font-size:.8em;font-weight:900;line-height:1;vertical-align:-.15em;color:#3a2a00;box-shadow:inset 0 0 0 2px rgba(255,255,255,.5)}
.tmedal.g{background:radial-gradient(circle at 35% 30%,#fff3c4,#e8b931 55%,#b8860b)}.tmedal.s{background:radial-gradient(circle at 35% 30%,#ffffff,#c9ced6 55%,#8d939c);color:#2b2f36}
.wc-tro .tmedal{font-size:30px}
.aw{position:relative;background:linear-gradient(170deg,#0f1f47,#0a1633 55%,#0d1a3c);border:1px solid rgba(214,177,92,.75);border-radius:18px;padding:22px 20px 20px;text-align:center;color:#fff;animation:wcIn .5s ease-out}
.aw-k{font-size:11px;font-weight:800;letter-spacing:.18em;color:#d6b15c;text-transform:uppercase}
.aw-img{display:block;width:72%;max-height:46vh;object-fit:contain;margin:14px auto;border-radius:12px;background:#fff}
.aw-p{font:italic 14px Lora,Georgia,serif;color:#e9dcc0}.aw-n{font:600 24px/1.2 Lora,Georgia,serif;margin-top:2px}
.aw-c{font:400 13.4px/1.55 Lora,Georgia,serif;color:#dfe4f0;margin:10px 4px 0}.aw-cg{font-size:13px;color:#f2d98f;font-weight:700;margin:12px 0 0}
.aw-ban{display:flex;align-items:center;gap:12px;width:100%;margin:16px 0 0;padding:12px 14px;border-radius:14px;border:1px solid rgba(214,177,92,.6);background:linear-gradient(135deg,rgba(242,184,75,.18),rgba(225,25,46,.08));color:#fff;text-align:left}
.aw-ban>span:first-child{font-size:26px}.aw-ban b{display:block;font-size:14px}.aw-ban .small{color:#f2d98f}.aw-go{margin-left:auto;font-size:22px;color:#d6b15c}
.aw-st{display:flex;gap:4vw;justify-content:center;align-items:flex-end;margin-top:2vh}.aw-st-i{display:flex;flex-direction:column;align-items:center;gap:8px;max-width:40vw;animation:drwin .8s ease-out}
.aw-st-i img{height:52vh;object-fit:contain;border-radius:14px;background:#fff}.aw-st-i b{font-size:clamp(22px,3vw,44px);color:var(--gold);text-align:center}
.pc3r{position:absolute;left:0;right:0;transform:translateY(-80%);text-align:center;color:#C9D1E6;font-family:CertBook,"Century Gothic",Montserrat,sans-serif;font-weight:400;white-space:nowrap;line-height:1}
</style>
